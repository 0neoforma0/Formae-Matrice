# Pipeline CI — Matrice (Lot 1 Fondations, décision 11/08/2026 : dépôt mono-repo)
#
# Ne se déclenche que sur les changements backend/ tant que le frontend
# n'a pas de code substantiel (évite des runs vides).
#
# Ce fichier existe et est versionné dès le Lot 1, mais ne s'exécutera
# qu'une fois le dépôt poussé sur GitHub — il ne tourne pas dans le
# conteneur de développement local.

name: CI Matrice

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matrice
          POSTGRES_PASSWORD: matrice_ci
          POSTGRES_DB: matrice
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://matrice:matrice_ci@localhost:5432/matrice
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Appliquer les migrations (valide le schéma réel)
        working-directory: backend
        run: alembic upgrade head

      - name: Lancer les tests
        working-directory: backend
        run: pytest -v

      - name: Vérifier que l'application démarre
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/health
